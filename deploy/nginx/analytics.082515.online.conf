server {
  listen 80;
  listen [::]:80;
  server_name analytics.082515.online;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name analytics.082515.online;

  ssl_certificate /etc/letsencrypt/live/analytics.082515.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/analytics.082515.online/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:QuizSolverTLS:10m;
  ssl_session_tickets off;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 1m;

  location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
